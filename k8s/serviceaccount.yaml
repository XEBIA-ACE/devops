apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${APP_NAME}
  labels:
    app: ${APP_NAME}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${APP_NAME}
  labels:
    app: ${APP_NAME}
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${APP_NAME}
  labels:
    app: ${APP_NAME}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${APP_NAME}
subjects:
- kind: ServiceAccount
  name: ${APP_NAME}
  namespace: ${K8S_NAMESPACE}
