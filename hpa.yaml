---
# Horizontal Pod Autoscaler for HAProxy Ingress Controller
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: haproxy-ingress-hpa
  namespace: data-processing
  labels:
    app: haproxy-ingress
    component: controller
  annotations:
    description: "HPA for HAProxy Ingress Controller based on CPU and memory"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: haproxy-ingress-controller

  # Scaling boundaries
  minReplicas: 3
  maxReplicas: 10

  # Scaling behavior configuration
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 minutes before scaling down
      policies:
      - type: Percent
        value: 50  # Scale down max 50% of current pods
        periodSeconds: 60
      - type: Pods
        value: 2  # Or max 2 pods
        periodSeconds: 60
      selectPolicy: Min  # Use the policy that scales down the least

    scaleUp:
      stabilizationWindowSeconds: 60  # Wait 1 minute before scaling up
      policies:
      - type: Percent
        value: 100  # Scale up max 100% of current pods
        periodSeconds: 30
      - type: Pods
        value: 4  # Or max 4 pods
        periodSeconds: 30
      selectPolicy: Max  # Use the policy that scales up the most

  # Metrics for autoscaling
  metrics:
  # CPU utilization target
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70  # Target 70% CPU utilization

  # Memory utilization target
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80  # Target 80% memory utilization

  # Custom metric: Request rate (requires Prometheus Adapter)
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "1000"  # Scale when avg requests per pod exceeds 1000/s

  # Custom metric: Connection count
  - type: Pods
    pods:
      metric:
        name: haproxy_active_connections
      target:
        type: AverageValue
        averageValue: "500"  # Scale when avg connections per pod exceeds 500

---
# Horizontal Pod Autoscaler for data processing application
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: data-processing-app-hpa
  namespace: data-processing
  labels:
    app: data-processing
    component: worker
  annotations:
    description: "HPA for data processing application with custom metrics"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: data-processing-app

  minReplicas: 3
  maxReplicas: 20

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600  # Wait 10 minutes before scaling down (longer for data processing)
      policies:
      - type: Percent
        value: 25  # Scale down max 25% of current pods
        periodSeconds: 120
      - type: Pods
        value: 1  # Or max 1 pod at a time
        periodSeconds: 120
      selectPolicy: Min

    scaleUp:
      stabilizationWindowSeconds: 30  # Quick scale up for spikes
      policies:
      - type: Percent
        value: 100  # Double the pods quickly
        periodSeconds: 30
      - type: Pods
        value: 5  # Or add up to 5 pods
        periodSeconds: 30
      selectPolicy: Max

  metrics:
  # CPU utilization
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75

  # Memory utilization
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 85

  # Custom metric: Queue depth (requires Prometheus Adapter)
  - type: Pods
    pods:
      metric:
        name: job_queue_depth
      target:
        type: AverageValue
        averageValue: "100"  # Scale when avg queue depth per pod exceeds 100

  # Custom metric: Processing rate
  - type: Pods
    pods:
      metric:
        name: jobs_processed_per_minute
      target:
        type: AverageValue
        averageValue: "50"  # Scale to maintain 50 jobs/min per pod

---
# Vertical Pod Autoscaler for data processing application (optional)
# Provides resource recommendations - can be used alongside HPA
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: data-processing-app-vpa
  namespace: data-processing
  labels:
    app: data-processing
    component: worker
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: data-processing-app

  # Update mode: Off (recommendations only), Initial (on pod creation), Auto (live updates)
  updatePolicy:
    updateMode: "Off"  # Use "Off" with HPA to avoid conflicts, only get recommendations

  # Resource policy - define min/max boundaries
  resourcePolicy:
    containerPolicies:
    - containerName: data-processor
      minAllowed:
        cpu: 500m
        memory: 1Gi
      maxAllowed:
        cpu: 4000m
        memory: 8Gi
      controlledResources:
      - cpu
      - memory
      # Scaling mode for each resource
      mode: Auto

