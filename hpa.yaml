---
# ConfigMap for custom metrics configuration (Prometheus Adapter)
# This enables HPA to use custom Prometheus metrics
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-adapter-config
  namespace: monitoring
  labels:
    app: prometheus-adapter
data:
  config.yaml: |
    rules:
    # HAProxy metrics
    - seriesQuery: 'haproxy_frontend_http_requests_total{namespace="data-processing"}'
      resources:
        overrides:
          namespace: {resource: "namespace"}
          pod: {resource: "pod"}
      name:
        matches: "^(.*)_total$"
        as: "http_requests_per_second"
      metricsQuery: 'rate(<<.Series>>{<<.LabelMatchers>>}[1m])'

    - seriesQuery: 'haproxy_frontend_current_sessions{namespace="data-processing"}'
      resources:
        overrides:
          namespace: {resource: "namespace"}
          pod: {resource: "pod"}
      name:
        as: "haproxy_active_connections"
      metricsQuery: 'avg_over_time(<<.Series>>{<<.LabelMatchers>>}[1m])'

    # Application metrics
    - seriesQuery: 'job_queue_depth{namespace="data-processing"}'
      resources:
        overrides:
          namespace: {resource: "namespace"}
          pod: {resource: "pod"}
      name:
        as: "job_queue_depth"
      metricsQuery: 'avg_over_time(<<.Series>>{<<.LabelMatchers>>}[1m])'

    - seriesQuery: 'jobs_processed_total{namespace="data-processing"}'
      resources:
        overrides:
          namespace: {resource: "namespace"}
          pod: {resource: "pod"}
      name:
        matches: "^(.*)_total$"
        as: "jobs_processed_per_minute"
      metricsQuery: 'rate(<<.Series>>{<<.LabelMatchers>>}[1m]) * 60'
