spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: test-secret-key-for-jwt-token-generation-must-be-256-bits
    expiration: 3600000
    refresh-expiration: 86400000

  auth0:
    enabled: false

  keycloak:
    enabled: false

logging:
  level:
    root: INFO
    com.enterprise.authservice: DEBUG
