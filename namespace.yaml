---
# Namespace for data processing application with resource quotas and limits
apiVersion: v1
kind: Namespace
metadata:
  name: data-processing
  labels:
    name: data-processing
    environment: production
    team: platform-engineering
    cost-center: data-ops
  annotations:
    description: "Data processing application with HAProxy ingress controller"
    owner: "platform-team@example.com"

---
# Resource Quota to limit namespace resource consumption
apiVersion: v1
kind: ResourceQuota
metadata:
  name: data-processing-quota
  namespace: data-processing
spec:
  hard:
    requests.cpu: "20"           # Total CPU requests
    requests.memory: 40Gi        # Total memory requests
    limits.cpu: "40"             # Total CPU limits
    limits.memory: 80Gi          # Total memory limits
    persistentvolumeclaims: "10" # Max PVCs
    services.loadbalancers: "2"  # Max LoadBalancer services
    pods: "50"                   # Max pod count

---
# Limit Range to set default resource constraints for containers
apiVersion: v1
kind: LimitRange
metadata:
  name: data-processing-limits
  namespace: data-processing
spec:
  limits:
  # Container limits
  - max:
      cpu: "4"
      memory: 8Gi
    min:
      cpu: "100m"
      memory: 128Mi
    default:
      cpu: "500m"
      memory: 512Mi
    defaultRequest:
      cpu: "200m"
      memory: 256Mi
    type: Container
  # Pod limits
  - max:
      cpu: "8"
      memory: 16Gi
    min:
      cpu: "100m"
      memory: 128Mi
    type: Pod
  # PVC limits
  - max:
      storage: 100Gi
    min:
      storage: 1Gi
    type: PersistentVolumeClaim
