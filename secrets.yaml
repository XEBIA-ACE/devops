---
# External Secret for TLS certificates using External Secrets Operator
# This references secrets stored in external secret management systems (AWS Secrets Manager, Vault, etc.)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: haproxy-tls-cert
  namespace: data-processing
  labels:
    app: haproxy-ingress
    component: controller
  annotations:
    description: "TLS certificate for HAProxy ingress from external secrets manager"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend  # Reference to SecretStore
    kind: SecretStore
  target:
    name: haproxy-tls-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .tlscert | b64dec }}"
        tls.key: "{{ .tlskey | b64dec }}"
  data:
  - secretKey: tlscert
    remoteRef:
      key: data-processing/tls
      property: cert
  - secretKey: tlskey
    remoteRef:
      key: data-processing/tls
      property: key

---
# External Secret for application credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: data-processing-credentials
  namespace: data-processing
  labels:
    app: data-processing
  annotations:
    description: "Application credentials from external secrets manager"
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: data-processing-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        database-password: "{{ .dbpassword | b64dec }}"
        api-key: "{{ .apikey | b64dec }}"
        encryption-key: "{{ .enckey | b64dec }}"
  data:
  - secretKey: dbpassword
    remoteRef:
      key: data-processing/app
      property: database-password
  - secretKey: apikey
    remoteRef:
      key: data-processing/app
      property: api-key
  - secretKey: enckey
    remoteRef:
      key: data-processing/app
      property: encryption-key

---
# SecretStore configuration for Vault (example)
# This defines how to connect to the external secret management system
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: data-processing
spec:
  provider:
    vault:
      server: "https://vault.example.com"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "data-processing"
          serviceAccountRef:
            name: data-processing-app

