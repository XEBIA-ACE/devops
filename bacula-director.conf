#
# Bacula Director Configuration for Kubernetes PV Backup
# Implements Custom GFS Retention with Weekly Backups
#

Director {
  Name = k8s-backup-dir
  DIRport = 9101
  QueryFile = "/opt/bacula/scripts/query.sql"
  WorkingDirectory = "/var/lib/bacula"
  PidDirectory = "/var/run/bacula"
  Maximum Concurrent Jobs = 20
  Password = "@@DIRECTOR_PASSWORD@@"
  Messages = Daemon
  DirAddress = 0.0.0.0

  # TLS Configuration
  TLS Enable = yes
  TLS Require = yes
  TLS Verify Peer = yes
  TLS CA Certificate File = /etc/bacula/ssl/ca.crt
  TLS Certificate = /etc/bacula/ssl/director.crt
  TLS Key = /etc/bacula/ssl/director.key
}

#
# Catalog Configuration (PostgreSQL Backend)
#
Catalog {
  Name = MyCatalog
  dbname = "bacula"
  dbuser = "bacula"
  dbpassword = "@@DB_PASSWORD@@"
  dbaddress = "bacula-catalog-db"
  dbport = 5432
}

#
# Messages Configuration
#
Messages {
  Name = Standard
  director = k8s-backup-dir = all, !skipped, !restored

  # Send alerts to monitoring system
  mail command = "/opt/bacula/scripts/send-alert.sh \"%t\" \"%e\" \"%c\" \"%l\" \"%n\""
  operator = ops-team@company.com = mount
  mail = ops-team@company.com = all, !skipped

  # Append to log files
  append = "/var/log/bacula/bacula.log" = all, !skipped
  append = "/var/log/bacula/bacula-errors.log" = error, fatal

  console = all, !skipped, !saved
}

Messages {
  Name = Daemon
  mailcommand = "/opt/bacula/scripts/send-alert.sh \"%t\" \"%e\" \"%c\" \"%l\" \"%n\""
  mail = ops-team@company.com = all, !skipped
  append = "/var/log/bacula/bacula-daemon.log" = all, !skipped
  console = all, !skipped, !saved
}

#
# Storage Daemon Configuration
#
Storage {
  Name = bacula-sd-azure
  Address = bacula-sd-azure
  SDPort = 9103
  Password = "@@SD_PASSWORD@@"
  Device = AzureBlobDevice
  Media Type = Azure-Blob
  Maximum Concurrent Jobs = 10

  TLS Enable = yes
  TLS Require = yes
  TLS CA Certificate File = /etc/bacula/ssl/ca.crt
  TLS Certificate = /etc/bacula/ssl/director.crt
  TLS Key = /etc/bacula/ssl/director.key
}

Storage {
  Name = bacula-sd-s3
  Address = bacula-sd-s3
  SDPort = 9103
  Password = "@@SD_PASSWORD@@"
  Device = S3Device
  Media Type = AWS-S3
  Maximum Concurrent Jobs = 10

  TLS Enable = yes
  TLS Require = yes
  TLS CA Certificate File = /etc/bacula/ssl/ca.crt
  TLS Certificate = /etc/bacula/ssl/director.crt
  TLS Key = /etc/bacula/ssl/director.key
}

#
# File Sets - Define what to backup
#

# Kubernetes PV Backup FileSet
FileSet {
  Name = "K8s-PV-FileSet"
  Enable VSS = no

  Include {
    Options {
      signature = SHA512
      compression = GZIP
      verify = pins5
      onefs = no
      sparse = yes
      checkfilechanges = yes

      # Client-side encryption
      PKI Encrypt = yes
      PKI Keypair = "/etc/bacula/pki/master.pem"

      # ACL and Extended Attributes
      aclsupport = yes
      xattrsupport = yes
    }

    File = /backup/pv-data
  }

  Exclude {
    File = /backup/pv-data/tmp
    File = /backup/pv-data/*.tmp
    File = /backup/pv-data/.cache
    File = /backup/pv-data/lost+found
  }
}

# PostgreSQL Database FileSet
FileSet {
  Name = "PostgreSQL-FileSet"

  Include {
    Options {
      signature = SHA512
      compression = GZIP
      verify = pins5

      # Client-side encryption
      PKI Encrypt = yes
      PKI Keypair = "/etc/bacula/pki/master.pem"
    }

    File = /backup/postgres-dump
    File = /backup/postgres-wal
  }
}

# MySQL Database FileSet
FileSet {
  Name = "MySQL-FileSet"

  Include {
    Options {
      signature = SHA512
      compression = GZIP
      verify = pins5

      # Client-side encryption
      PKI Encrypt = yes
      PKI Keypair = "/etc/bacula/pki/master.pem"
    }

    File = /backup/mysql-dump
  }
}

# etcd Cluster State FileSet
FileSet {
  Name = "ETCD-FileSet"

  Include {
    Options {
      signature = SHA512
      compression = GZIP
      verify = pins5

      # Client-side encryption
      PKI Encrypt = yes
      PKI Keypair = "/etc/bacula/pki/master.pem"
    }

    File = /backup/etcd-snapshot
    File = /backup/k8s-resources
  }
}

#
# Schedule Definitions - Weekly Backups with GFS Rotation
#

Schedule {
  Name = "WeeklyCycle"

  # Weekly Full Backup (Saturday 02:00 AM)
  Run = Level=Full weekly sat at 02:00

  # Daily Differential Backups for faster restore
  Run = Level=Differential daily at 03:00

  # Incremental every 6 hours for point-in-time recovery
  Run = Level=Incremental hourly at 0:15
  Run = Level=Incremental hourly at 6:15
  Run = Level=Incremental hourly at 12:15
  Run = Level=Incremental hourly at 18:15
}

#
# Pool Definitions - Custom GFS Retention
#

# Grandfather Pool - Monthly retention for 12 months
Pool {
  Name = Grandfather-Pool
  Pool Type = Backup
  Recycle = yes
  AutoPrune = yes
  Volume Retention = 365 days
  Maximum Volume Bytes = 50G
  Maximum Volumes = 24
  Label Format = "Grandfather-${Year}-${Month:p/2/0/r}-Vol${MediaId}"
  Volume Use Duration = 23h

  # Storage priority: Azure primary, S3 secondary
  Storage = bacula-sd-azure
  Next Pool = Offsite-Pool

  # Catalog backup retention
  Catalog Files = yes
}

# Father Pool - Weekly retention for 8 weeks
Pool {
  Name = Father-Pool
  Pool Type = Backup
  Recycle = yes
  AutoPrune = yes
  Volume Retention = 56 days
  Maximum Volume Bytes = 50G
  Maximum Volumes = 16
  Label Format = "Father-${Year}-Week${WeekOfYear:p/2/0/r}-Vol${MediaId}"
  Volume Use Duration = 23h

  Storage = bacula-sd-azure
  Next Pool = Offsite-Pool

  Catalog Files = yes
}

# Son Pool - Daily retention for 14 days
Pool {
  Name = Son-Pool
  Pool Type = Backup
  Recycle = yes
  AutoPrune = yes
  Volume Retention = 14 days
  Maximum Volume Bytes = 20G
  Maximum Volumes = 28
  Label Format = "Son-${Year}-${Month:p/2/0/r}-${Day:p/2/0/r}-Vol${MediaId}"
  Volume Use Duration = 23h

  Storage = bacula-sd-azure
  Next Pool = Offsite-Pool

  Catalog Files = yes
}

# Offsite Pool - S3 for disaster recovery
Pool {
  Name = Offsite-Pool
  Pool Type = Backup
  Recycle = yes
  AutoPrune = yes
  Volume Retention = 365 days
  Maximum Volume Bytes = 50G
  Maximum Volumes = 100
  Label Format = "Offsite-${Year}-${Month:p/2/0/r}-Vol${MediaId}"

  Storage = bacula-sd-s3

  Catalog Files = yes
}

# Incremental Pool - Short-term retention for point-in-time recovery
Pool {
  Name = Incremental-Pool
  Pool Type = Backup
  Recycle = yes
  AutoPrune = yes
  Volume Retention = 7 days
  Maximum Volume Bytes = 10G
  Maximum Volumes = 50
  Label Format = "Inc-${Year}${Month:p/2/0/r}${Day:p/2/0/r}-${Hour:p/2/0/r}-Vol${MediaId}"
  Volume Use Duration = 6h

  Storage = bacula-sd-azure

  Catalog Files = yes
}

#
# Job Definitions
#

# Kubernetes PV Backup Job
JobDefs {
  Name = "K8s-PV-JobDef"
  Type = Backup
  Level = Incremental
  Client = k8s-backup-client
  Schedule = "WeeklyCycle"
  Storage = bacula-sd-azure
  Messages = Standard
  Priority = 10
  Write Bootstrap = "/var/lib/bacula/bootstrap/%c.bsr"

  # Pre/Post job scripts
  Client Run Before Job = "/opt/bacula/scripts/pre-backup.sh %l %n"
  Client Run After Job = "/opt/bacula/scripts/post-backup.sh %l %n %e"
  Run Script {
    Console = "update stats"
    RunsWhen = After
    RunsOnClient = No
  }

  # Pool selection based on level and schedule
  Full Backup Pool = Father-Pool
  Differential Backup Pool = Son-Pool
  Incremental Backup Pool = Incremental-Pool

  # Enable accurate mode for incremental
  Accurate = yes

  # Spool data for better performance
  Spool Data = yes
  Spool Attributes = yes

  # Maximum run times
  Maximum Run Time = 6 hours
  Maximum Start Delay = 30 minutes

  # Concurrent jobs
  Maximum Concurrent Jobs = 5

  # Reschedule on error
  Reschedule On Error = yes
  Reschedule Interval = 1 hour
  Reschedule Times = 3
}

# PostgreSQL Backup Job
Job {
  Name = "PostgreSQL-Backup"
  JobDefs = "K8s-PV-JobDef"
  FileSet = "PostgreSQL-FileSet"
  Client Run Before Job = "/opt/bacula/scripts/postgres-backup.sh %l"
  Level = Full
  Schedule = "WeeklyCycle"
  Priority = 5
}

# MySQL Backup Job
Job {
  Name = "MySQL-Backup"
  JobDefs = "K8s-PV-JobDef"
  FileSet = "MySQL-FileSet"
  Client Run Before Job = "/opt/bacula/scripts/mysql-backup.sh %l"
  Level = Full
  Schedule = "WeeklyCycle"
  Priority = 5
}

# etcd Backup Job
Job {
  Name = "ETCD-Backup"
  JobDefs = "K8s-PV-JobDef"
  FileSet = "ETCD-FileSet"
  Client Run Before Job = "/opt/bacula/scripts/etcd-backup.sh"
  Level = Full
  Schedule = "WeeklyCycle"
  Priority = 1
  Maximum Run Time = 1 hour
}

# Kubernetes PV Backup Jobs (per namespace)
Job {
  Name = "K8s-PV-Production"
  JobDefs = "K8s-PV-JobDef"
  FileSet = "K8s-PV-FileSet"
  Client = k8s-backup-client-prod
  Priority = 5
}

Job {
  Name = "K8s-PV-Staging"
  JobDefs = "K8s-PV-JobDef"
  FileSet = "K8s-PV-FileSet"
  Client = k8s-backup-client-staging
  Priority = 10
}

# Monthly Backup Job (Grandfather)
Job {
  Name = "Monthly-Archive"
  JobDefs = "K8s-PV-JobDef"
  FileSet = "K8s-PV-FileSet"
  Level = Full
  Schedule = "MonthlyCycle"
  Full Backup Pool = Grandfather-Pool
  Priority = 1
}

Schedule {
  Name = "MonthlyCycle"
  Run = Level=Full monthly on 1 at 01:00
}

# Catalog Backup Job
Job {
  Name = "BackupCatalog"
  JobDefs = "K8s-PV-JobDef"
  Level = Full
  FileSet = "Catalog"
  Schedule = "WeeklyCycle"

  # This creates an ASCII copy of the catalog
  RunBeforeJob = "/opt/bacula/scripts/make_catalog_backup.pl MyCatalog"

  # This deletes the copy of the catalog
  RunAfterJob  = "/opt/bacula/scripts/delete_catalog_backup"

  Write Bootstrap = "/var/lib/bacula/BackupCatalog.bsr"
  Priority = 11
}

FileSet {
  Name = "Catalog"
  Include {
    Options {
      signature = SHA512
      compression = GZIP
      PKI Encrypt = yes
      PKI Keypair = "/etc/bacula/pki/master.pem"
    }
    File = "/var/lib/bacula/bacula.sql"
    File = "/etc/bacula"
  }
}

#
# Restore Job Template
#
Job {
  Name = "RestoreFiles"
  Type = Restore
  Client = k8s-backup-client
  FileSet = "K8s-PV-FileSet"
  Storage = bacula-sd-azure
  Pool = Father-Pool
  Messages = Standard
  Where = /tmp/bacula-restores

  # Restore verification
  Run Script {
    Console = "list jobid=%i"
    RunsWhen = After
    RunsOnClient = No
  }
}

#
# Client Definitions
#
Client {
  Name = k8s-backup-client
  Address = bacula-fd-service.backup.svc.cluster.local
  FDPort = 9102
  Catalog = MyCatalog
  Password = "@@FD_PASSWORD@@"
  File Retention = 60 days
  Job Retention = 180 days
  AutoPrune = yes
  Maximum Concurrent Jobs = 5

  TLS Enable = yes
  TLS Require = yes
  TLS CA Certificate File = /etc/bacula/ssl/ca.crt
  TLS Certificate = /etc/bacula/ssl/director.crt
  TLS Key = /etc/bacula/ssl/director.key
}

Client {
  Name = k8s-backup-client-prod
  Address = bacula-fd-prod.production.svc.cluster.local
  FDPort = 9102
  Catalog = MyCatalog
  Password = "@@FD_PASSWORD_PROD@@"
  File Retention = 90 days
  Job Retention = 365 days
  AutoPrune = yes
  Maximum Concurrent Jobs = 5

  TLS Enable = yes
  TLS Require = yes
  TLS CA Certificate File = /etc/bacula/ssl/ca.crt
  TLS Certificate = /etc/bacula/ssl/director.crt
  TLS Key = /etc/bacula/ssl/director.key
}

Client {
  Name = k8s-backup-client-staging
  Address = bacula-fd-staging.staging.svc.cluster.local
  FDPort = 9102
  Catalog = MyCatalog
  Password = "@@FD_PASSWORD_STAGING@@"
  File Retention = 30 days
  Job Retention = 90 days
  AutoPrune = yes
  Maximum Concurrent Jobs = 5

  TLS Enable = yes
  TLS Require = yes
  TLS CA Certificate File = /etc/bacula/ssl/ca.crt
  TLS Certificate = /etc/bacula/ssl/director.crt
  TLS Key = /etc/bacula/ssl/director.key
}

#
# Console Definition
#
Console {
  Name = k8s-backup-mon
  Password = "@@CONSOLE_PASSWORD@@"
  CommandACL = status, .status
}
