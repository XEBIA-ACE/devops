#
# Bacula Storage Daemon Configuration - AWS S3
#

Storage {
  Name = bacula-sd-s3
  SDPort = 9103
  WorkingDirectory = "/var/lib/bacula"
  Pid Directory = "/var/run/bacula"
  Maximum Concurrent Jobs = 20
  SDAddress = 0.0.0.0

  # TLS Configuration
  TLS Enable = yes
  TLS Require = yes
  TLS Verify Peer = yes
  TLS CA Certificate File = /etc/bacula/ssl/ca.crt
  TLS Certificate = /etc/bacula/ssl/sd.crt
  TLS Key = /etc/bacula/ssl/sd.key
}

#
# Director Access Control
#
Director {
  Name = k8s-backup-dir
  Password = "@@SD_PASSWORD@@"

  TLS Enable = yes
  TLS Require = yes
  TLS Verify Peer = yes
  TLS CA Certificate File = /etc/bacula/ssl/ca.crt
  TLS Certificate = /etc/bacula/ssl/sd.crt
  TLS Key = /etc/bacula/ssl/sd.key
}

#
# AWS S3 Device Configuration
#
Device {
  Name = S3Device
  Media Type = AWS-S3
  Archive Device = /mnt/s3-backup
  Device Type = File
  LabelMedia = yes
  Random Access = yes
  AutomaticMount = yes
  RemovableMedia = no
  AlwaysOpen = no
  Maximum Concurrent Jobs = 10

  # Spool configuration for performance
  Maximum Spool Size = 100G
  Maximum Job Spool Size = 10G
  Spool Directory = /var/spool/bacula

  # Volume management
  Maximum File Size = 5G
  Volume Poll Interval = 15 sec
  Maximum Open Wait = 300 sec
}

#
# S3 Cloud Driver Configuration
#
Device {
  Name = S3CloudDevice
  Media Type = AWS-S3-Cloud
  Device Type = cloud
  Cloud Driver = "S3"

  # AWS S3 Configuration
  Host Name = "s3.@@AWS_REGION@@.amazonaws.com"
  Bucket Name = "@@S3_BUCKET_NAME@@"
  Access Key = "@@AWS_ACCESS_KEY_ID@@"
  Secret Key = "@@AWS_SECRET_ACCESS_KEY@@"

  # S3 Region
  Region = "@@AWS_REGION@@"

  # Storage class (STANDARD, STANDARD_IA, GLACIER_IR, etc.)
  Storage Class = STANDARD_IA

  # Upload/download configuration
  Maximum Concurrent Jobs = 5
  Upload = each_part

  # Chunking for large files (S3 multipart)
  Maximum Part Size = 100M

  # Retry configuration
  Maximum Retry = 5

  # SSL/TLS
  Protocol = https
  URI Style = host

  # Server-side encryption (in addition to client-side)
  Server Side Encryption = aws:kms
  SSE KMS Key Id = "@@KMS_KEY_ID@@"

  # Performance tuning
  Truncate On Close = yes

  # S3 lifecycle policy support
  Create Bucket = no
}

#
# Messages
#
Messages {
  Name = Standard
  director = k8s-backup-dir = all
  append = "/var/log/bacula/bacula-sd-s3.log" = all, !skipped
}
