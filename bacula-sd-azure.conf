#
# Bacula Storage Daemon Configuration - Azure Blob Storage
#

Storage {
  Name = bacula-sd-azure
  SDPort = 9103
  WorkingDirectory = "/var/lib/bacula"
  Pid Directory = "/var/run/bacula"
  Maximum Concurrent Jobs = 20
  SDAddress = 0.0.0.0

  # TLS Configuration
  TLS Enable = yes
  TLS Require = yes
  TLS Verify Peer = yes
  TLS CA Certificate File = /etc/bacula/ssl/ca.crt
  TLS Certificate = /etc/bacula/ssl/sd.crt
  TLS Key = /etc/bacula/ssl/sd.key
}

#
# Director Access Control
#
Director {
  Name = k8s-backup-dir
  Password = "@@SD_PASSWORD@@"

  TLS Enable = yes
  TLS Require = yes
  TLS Verify Peer = yes
  TLS CA Certificate File = /etc/bacula/ssl/ca.crt
  TLS Certificate = /etc/bacula/ssl/sd.crt
  TLS Key = /etc/bacula/ssl/sd.key
}

#
# Azure Blob Storage Device
#
Device {
  Name = AzureBlobDevice
  Media Type = Azure-Blob
  Archive Device = /mnt/azure-blob
  Device Type = File
  LabelMedia = yes
  Random Access = yes
  AutomaticMount = yes
  RemovableMedia = no
  AlwaysOpen = no
  Maximum Concurrent Jobs = 10

  # Spool configuration for performance
  Maximum Spool Size = 100G
  Maximum Job Spool Size = 10G
  Spool Directory = /var/spool/bacula

  # Volume management
  Maximum File Size = 5G
  Volume Poll Interval = 15 sec
  Maximum Open Wait = 300 sec

  # Enable hardware compression if supported
  Hardware End of Medium = no
}

#
# Cloud Storage Plugin Configuration (Azure Blob)
#
Device {
  Name = AzureCloudDevice
  Media Type = Azure-Blob-Cloud
  Device Type = cloud
  Cloud Driver = "Azure"

  # Azure authentication
  Host Name = "@@AZURE_STORAGE_ACCOUNT@@.blob.core.windows.net"
  Bucket Name = "@@AZURE_CONTAINER_NAME@@"
  Access Key = "@@AZURE_ACCESS_KEY@@"

  # Upload/download configuration
  Maximum Concurrent Jobs = 5
  Upload = each_part

  # Chunking for large files
  Maximum Part Size = 100M

  # Retry configuration
  Maximum Retry = 5

  # SSL/TLS
  Protocol = https
  URI Style = host

  # Performance tuning
  Truncate On Close = yes
}

#
# Messages
#
Messages {
  Name = Standard
  director = k8s-backup-dir = all
  append = "/var/log/bacula/bacula-sd.log" = all, !skipped
}
