#
# Bacula File Daemon Configuration
# Deploy this on each Kubernetes node or as a DaemonSet
#

FileDaemon {
  Name = k8s-backup-client
  FDport = 9102
  WorkingDirectory = /var/lib/bacula
  Pid Directory = /var/run/bacula
  Maximum Concurrent Jobs = 20
  FDAddress = 0.0.0.0

  # Enable plugins
  Plugin Directory = /opt/bacula/plugins

  # TLS Configuration
  TLS Enable = yes
  TLS Require = yes
  TLS Verify Peer = yes
  TLS CA Certificate File = /etc/bacula/ssl/ca.crt
  TLS Certificate = /etc/bacula/ssl/fd.crt
  TLS Key = /etc/bacula/ssl/fd.key

  # PKI for client-side encryption
  PKI Signatures = yes
  PKI Encryption = yes
  PKI Keypair = /etc/bacula/pki/fd-key.pem
  PKI Master Key = /etc/bacula/pki/master.pem

  # Heartbeat for long-running jobs
  Heartbeat Interval = 60 seconds
}

#
# Director Access Control
#
Director {
  Name = k8s-backup-dir
  Password = "@@FD_PASSWORD@@"

  TLS Enable = yes
  TLS Require = yes
  TLS Verify Peer = yes
  TLS CA Certificate File = /etc/bacula/ssl/ca.crt
  TLS Certificate = /etc/bacula/ssl/fd.crt
  TLS Key = /etc/bacula/ssl/fd.key
}

#
# Restricted Director for monitoring only
#
Director {
  Name = k8s-backup-mon
  Password = "@@MONITOR_PASSWORD@@"
  Monitor = yes
}

#
# Messages
#
Messages {
  Name = Standard
  director = k8s-backup-dir = all, !skipped, !restored
  append = "/var/log/bacula/bacula-fd.log" = all, !skipped
}
